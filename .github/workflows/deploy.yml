name: Build and Push Deno Container to Azure

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    # 1. Check out the repository code onto the runner (Updated to v6 for Node 24 support)
    - name: Checkout Source Code
      uses: actions/checkout@v6

    # 2. Set up Docker Buildx for optimized container builds (Updated to v3)
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    # 3. Log into your private Azure Container Registry (Updated to v3)
    - name: Log in to Azure Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ secrets.ACR_LOGIN_SERVER }}
        username: ${{ secrets.ACR_USERNAME }}
        password: ${{ secrets.ACR_PASSWORD }}

    # 4. Build the Deno image and push it to Azure (Updated to v7 for Node 24 support)
    - name: Build and Push Docker Image
      uses: docker/build-push-action@v7
      with:
        context: .
        file: ./Dockerfile
        push: true
        tags: |
          ${{ secrets.ACR_LOGIN_SERVER }}/base44app:latest
          ${{ secrets.ACR_LOGIN_SERVER }}/base44app:${{ github.sha }}
          
# 5. Explicitly tell Azure Web App to pull the new container image
    - name: Deploy to Azure Web App
      uses: azure/webapps-deploy@v3
      with:
        app-name: 'sp-base44-az-app' # Replace with your exact Azure Web App name
        publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
        images: '${{ secrets.ACR_LOGIN_SERVER }}/base44app:latest'
