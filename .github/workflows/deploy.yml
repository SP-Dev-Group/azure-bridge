name: Build and Push Deno Container to Azure

on:
  push:
    branches:
      - main
# ⚠️ CRUCIAL ADDITION: Gives GitHub permission to generate the secure Azure OIDC token
permissions:
  id-token: write
  contents: read


jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    # 1. Check out the repository code onto the runner
    - name: Checkout Source Code
      uses: actions/checkout@v6

    # 2. Set up Docker Buildx for optimized container builds
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    # 3. Log into your private Azure Container Registry
    - name: Log in to Azure Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ secrets.ACR_LOGIN_SERVER }}
        username: ${{ secrets.ACR_USERNAME }}
        password: ${{ secrets.ACR_PASSWORD }}

    # 4. Build the Deno image and push it to Azure
    - name: Build and Push Docker Image
      uses: docker/build-push-action@v7
      with:
        context: .
        file: ./Dockerfile
        push: true
        tags: |
          ${{ secrets.ACR_LOGIN_SERVER }}/base44app:latest
          ${{ secrets.ACR_LOGIN_SERVER }}/base44app:${{ github.sha }}

    # 5. Securely authenticate with Azure using your new App Registration credentials
    - name: Azure Login
      uses: azure/login@v2
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}

    # 6. Explicitly tell the Web App to pull the fresh Deno container image
    - name: Deploy Container to Azure Web App
      uses: azure/webapps-deploy@v3
      with:
        app-name: 'sp-base44-az-app' # Replace with your exact Azure Web App name
        images: '${{ secrets.ACR_LOGIN_SERVER }}/base44app:latest'
